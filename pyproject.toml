[project]
name = "comfyui-mg-cache"
version = "0.1.0"
description = "MG-Cache multi-granularity caching nodes for DiT models in ComfyUI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.15"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "T20"]
ignore = ["E501", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["comfy", "comfy_api"]
